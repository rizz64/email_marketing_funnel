{% extends "base.html" %}
{% block title %}Create Template{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <a href="{{ url_for('list_templates') }}" class="back-btn">← Templates</a>
        <h1>Create Email Template</h1>
    </div>

    <form method="POST" class="card form-card">
        <div class="form-group">
            <label for="name">Template Name *</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Welcome Series">
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="welcome">Welcome</option>
                <option value="newsletter">Newsletter</option>
                <option value="offer">Special Offer</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="subject">Subject Line</label>
            <input type="text" id="subject" name="subject" placeholder="Subject for this template">
        </div>
        <div class="form-group">
            <label for="body_html">Body (HTML) *</label>
            <textarea id="body_html" name="body_html" rows="10" required></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Template</button>
            <a href="{{ url_for('list_templates') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
